plugins { id 'com.android.application' }

android {
    namespace 'com.zizai.watermark'
    compileSdk 35

    defaultConfig {
        applicationId 'com.zizai.watermark'
        minSdk 29
        targetSdk 33
        versionCode 13
        versionName '0.7.0'
        ndk { abiFilters 'arm64-v8a' }
    }

    signingConfigs {
        development {
            storeFile rootProject.file('tooling/development.jks')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes { debug { signingConfig signingConfigs.development } }

    packaging { jniLibs { useLegacyPackaging true } }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// The wrapper uses Android framework APIs. AppCompat/Core are unused transitive UI dependencies.
dependencies {
    implementation files('libs/jna-5.18.1.aar', 'libs/tesseract4android-4.9.0.aar')
    implementation('io.github.junkfood02.youtubedl-android:library:0.18.1') {
        exclude group: 'androidx.appcompat'; exclude group: 'androidx.core'
    }
    implementation('io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1') {
        exclude group: 'androidx.appcompat'; exclude group: 'androidx.core'
    }
}

// Run tooling/prepare-auto.py first; models and native libraries are checksum pinned there.
tasks.named('preBuild').configure {
    doFirst {
        ['libs/jna-5.18.1.aar', 'libs/tesseract4android-4.9.0.aar',
         'src/main/assets/auto_models/UVR_MDXNET_9482.onnx',
         'src/main/assets/auto_models/tessdata/eng.traineddata',
         'src/main/assets/auto_models/tessdata/chi_sim.traineddata',
         'src/main/jniLibs/arm64-v8a/libsherpa-onnx-c-api.so',
         'src/main/jniLibs/arm64-v8a/libonnxruntime.so'].each {
            if (!file(it).exists()) throw new GradleException('Run: python3 tooling/prepare-auto.py --dir build-deps/auto')
        }
    }
}

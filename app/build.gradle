plugins { id 'com.android.application' }

android {
    namespace 'com.zizai.watermark'
    compileSdk 35

    defaultConfig {
        applicationId 'com.zizai.watermark'
        minSdk 29
        targetSdk 33
        versionCode 25
        versionName '0.6.19'
        ndk { abiFilters 'arm64-v8a' }
    }

    signingConfigs {
        development {
            storeFile rootProject.file('tooling/development.jks')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes { debug { signingConfig signingConfigs.development } }

    packaging { jniLibs { useLegacyPackaging true } }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// The wrapper uses Android framework APIs. AppCompat/Core are unused transitive UI dependencies.
dependencies {
    implementation('io.github.junkfood02.youtubedl-android:library:0.18.1') {
        exclude group: 'androidx.appcompat'; exclude group: 'androidx.core'
    }
    implementation('io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1') {
        exclude group: 'androidx.appcompat'; exclude group: 'androidx.core'
    }
}

// Fixed model weights ship with the APK; no runtime endpoint or API key is required.
tasks.register('prepareBgmModels', Exec) {
    workingDir rootProject.projectDir
    commandLine 'python3', 'tooling/prepare-bgm.py', '--cache', '.cache/bgm'
    inputs.file rootProject.file('tooling/bgm-lock.json')
    inputs.file rootProject.file('tooling/prepare-bgm.py')
    outputs.dir file('src/main/assets/bgm')
}
tasks.named('preBuild').configure { dependsOn 'prepareBgmModels' }

name: Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'tooling/**'
      - '*.gradle'
      - 'settings.gradle'
      - '.github/workflows/android-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare verified OCR and vocals components
        run: python3 tooling/prepare-auto.py --dir build-deps/auto
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: WatermarkWorkshop-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

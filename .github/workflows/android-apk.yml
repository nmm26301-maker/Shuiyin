name: Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - '*.gradle'
      - 'settings.gradle'
      - 'tooling/**'
      - 'tests/**'
      - '.github/workflows/android-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/cache@v4
        with:
          path: |
            .cache/engine-deps
            .cache/bgm
          key: search-deps-${{ runner.os }}-${{ hashFiles('tooling/engine-lock.json', 'tooling/test-search.py', 'tooling/bgm-lock.json', 'tooling/test-bgm.py') }}
      - name: Install audio test dependency
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Search regression gate
        run: python3 tooling/test-search.py --deps .cache/engine-deps --android "$ANDROID_HOME/platforms/android-35/android.jar"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: WatermarkWorkshop-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: WatermarkWorkshop-debug-apk
          path: apk
      - name: Publish development APK and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tooling/publish-apk.sh
